# conf.d is included from the image's existing http context.
map $uri $primelink_entrypoint {
    default /__primelink_no_static_route__;
    include /etc/nginx/primelink-static-routes.map;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Navigate accepts one slug, case-insensitively, with optional trailing slashes.
    # Relative redirects avoid exposing the container port behind a proxy.
    location ~* ^/usluge/([^/]+)/*$ {
        return 302 /$1;
    }

    location ~ "^/vendor/fonts/inter-[a-f0-9]{12}\.ttf$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /vendor/fonts/ {
        try_files $uri =404;
    }

    location / {
        # File checks only: do not add $uri/ (directory lookup) or an SPA fallback.
        # Mapped HTML is checked first, avoiding directory redirects for routes.
        try_files $primelink_entrypoint $uri =404;
    }
}
